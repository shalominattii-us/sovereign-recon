global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@sovereign.local'
  smtp_auth_username: 'alerts@sovereign.local'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  group_by: ['alertname', 'component']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        component: compliance
      receiver: 'compliance-alerts'
    - match:
        component: governor
      receiver: 'governor-alerts'
    - match:
          component: heretic
      receiver: 'heretic-alerts'

receivers:
  - name: 'default'
    email_configs:
      - to: 'sovereign-alerts@local'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#sovereign-alerts'
        send_resolved: true
        title: 'Sovereign Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'

  - name: 'critical-alerts'
    email_configs:
      - to: 'sovereign-critical@local'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#sovereign-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: 'compliance-alerts'
    email_configs:
      - to: 'sovereign-compliance@local'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#sovereign-compliance'
        send_resolved: true

  - name: 'governor-alerts'
    email_configs:
      - to: 'sovereign-governor@local'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#sovereign-governor'
        send_resolved: true

  - name: 'heretic-alerts'
    email_configs:
      - to: 'sovereign-heretic@local'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#sovereign-heretic'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'component', 'instance']
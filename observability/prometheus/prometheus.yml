global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'sovereign-stack'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Sovereign Kernel
  - job_name: 'sovereign-kernel'
    static_configs:
      - targets: ['host.docker.internal:9777']
    metrics_path: '/metrics'

  # Heretic LLM
  - job_name: 'heretic-llm'
    static_configs:
      - targets: ['host.docker.internal:9003']
    metrics_path: '/metrics'

  # Compliance Engine
  - job_name: 'compliance-engine'
    static_configs:
      - targets: ['host.docker.internal:9004']
    metrics_path: '/metrics'

  # CyberCore Bridge
  - job_name: 'cybercore-bridge'
    static_configs:
      - targets: ['host.docker.internal:9006']
    metrics_path: '/metrics'

  # AE-Hub v1 Kernel
  - job_name: 'aehub-v1-kernel'
    static_configs:
      - targets: ['host.docker.internal:7777']
    metrics_path: '/metrics'

  # Nanotransaction
  - job_name: 'nanotransaction'
    static_configs:
      - targets: ['host.docker.internal:9001']
    metrics_path: '/metrics'

  # Event Bus
  - job_name: 'event-bus'
    static_configs:
      - targets: ['host.docker.internal:9002']
    metrics_path: '/metrics'

  # Infra Agent
  - job_name: 'infra-agent'
    static_configs:
      - targets: ['host.docker.internal:9090']
    metrics_path: '/metrics'

  # Web UI
  - job_name: 'web-ui'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: '/metrics'

  # HUD
  - job_name: 'hud'
    static_configs:
      - targets: ['host.docker.internal:3002']
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Node Exporter (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']